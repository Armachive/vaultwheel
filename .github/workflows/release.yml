# a pushed tag like 1.0.2 becomes a GitHub release: the three files tools/release.sh makes, each with a provenance attestation.
# release.sh stops if the tag is not the version in manifest.json and versions.json. the release notes are the tag's message
name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          sh tools/release.sh "$TAG"
          sha256sum build/release/main.js build/release/manifest.json build/release/styles.css | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/main.js
            build/release/manifest.json
            build/release/styles.css
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (checkout leaves the tag as a plain pointer to the commit, so its message is fetched first. a tag with no message of its own gives the commit's)
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag --list "$TAG" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" build/release/main.js build/release/manifest.json build/release/styles.css
