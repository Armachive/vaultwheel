<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VaultWheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
// the font's stylesheet is added from here so it loads alongside the page: one written in the page holds back every
// script after it until it comes. start() waits for it before the cards are drawn
window.vwFontCss = new Promise(r => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap'; l.onload = l.onerror = () => r(); document.head.appendChild(l); });
</script>
<style>
  /* layout: the 3D wheel fills the window and a faint bar floats over the top of it. Retroma, light and dark, in the card colors */
  :root {
    --stage: #d3cee1; --card: #e4fff2; --line: #809288; --hi: #ffffff; --lo: #7575b8; --ink: #3d3e56;
    --acc: #7575b8; --acc2: oklch(0.80 0.14 225);      /* the accent (hovers, strings, links, sliders), apart from --lo which is only the bevel shade */
    --over: #809288; --over-ink: #f4fff9; --tip: #e4fff2; --veil: rgba(255,255,255,.38); --mist: #dddded;
    --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --stage: #000d06; --card: #021109; --line: #676991; --hi: #53876e; --lo: #000d06; --ink: #e2e4f0; --acc: #9b8cff; --acc2: oklch(0.88 0.13 172);
      --over: #2d4b3e; --over-ink: #e2e4f0; --tip: #021109; --veil: rgba(0,13,6,.52); --mist: #1d2733; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --stage: #000d06; --card: #021109; --line: #676991; --hi: #53876e; --lo: #000d06; --ink: #e2e4f0; --acc: #9b8cff; --acc2: oklch(0.88 0.13 172);
    --over: #2d4b3e; --over-ink: #e2e4f0; --tip: #021109; --veil: rgba(0,13,6,.52); --mist: #1d2733; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--stage); color: var(--ink); font-family: var(--serif); overflow: hidden; }
  #app { height: 100%; position: relative; }

  /* the bar: mostly see-through until you rest on it, blurred hardest at the very top and fading away downward */
  #bar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 16px calc(12px + env(safe-area-inset-left, 0px)); }
  #bar::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--card); opacity: .3; transition: opacity .25s ease;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); }
  #bar:hover::before, #bar:focus-within::before { opacity: 1; }
  #bar > * { flex-shrink: 0; }
  /* the path gives way first on a narrow screen (its crumbs cut off with an ellipsis), so the buttons always stay on screen */
  #bar > #path { flex-shrink: 1; }
  @media (max-width: 480px) { .crumb { max-width: 120px; } .crumb.here { flex-shrink: 0; } }
  .grow { flex: 1; min-width: 0; }
  /* every control is a tiny card: the card color, its outline, the light inset top left and the shade bottom right */
  .pill { font: 700 11px/1 var(--serif); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 8px;
    box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo); white-space: nowrap; }
  #path { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
  .crumb { font: 400 14px/32px var(--serif); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 9px; padding: 0 9px; cursor: pointer;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo); }
  .crumb:hover { filter: brightness(1.08); }
  .crumb.here { background: var(--over); color: var(--over-ink); cursor: default; box-shadow: inset -1.5px -1.5px 0 var(--lo); }
  .chev { color: var(--ink); font: 700 15px var(--serif); opacity: .6; }
  button.pill { cursor: pointer; }
  button.pill:hover { filter: brightness(1.08); }
  button.pill:active { box-shadow: inset 1.5px 1.5px 0 var(--lo), inset -1.5px -1.5px 0 var(--hi); }
  button.pill:focus-visible, .crumb:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  .round, .sq { width: 35px; height: 35px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .sq { border-radius: 10px; }
  .round svg, .sq svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #bTheme .sun, :root[data-theme="dark"] #bTheme .moon, :root[data-theme="willemstad"] #bTheme .moon { display: none; }
  :root[data-theme="dark"] #bTheme .sun, :root[data-theme="willemstad"] #bTheme .sun { display: block; }
  /* light to dark and back is a slow cross fade of the whole page, the scene with it (a view transition, see the theme button) */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .9s; animation-timing-function: ease-in-out; }
  ::view-transition { pointer-events: none; }
  /* the sort of the folder in the content column: a down triangle and the list of sorts under it */
  #dirWrap, #plusWrap { position: relative; }
  #bDir svg { fill: var(--ink); stroke-width: 1.2; }
  #bBoards { font-size: 17px; }
  #bDir.on { background: var(--over); }
  #bDir.on svg { fill: var(--over-ink); stroke: var(--over-ink); }
  #bMore svg { fill: var(--ink); stroke: none; }
  #plusPop { width: 150px; }
  /* (the bar's zoom, see fitBar, stays out of its menus: they keep their full size, just under their button) */
  #dirPop, #plusPop { position: absolute; right: 0; top: calc(41px * var(--barK, 1)); zoom: var(--barUn, 1); z-index: 26; padding: 6px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 400 13px/1.35 var(--serif);
    box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo), 0 10px 26px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 2px; }
  #dirPop { width: min(260px, calc(100vw - 24px)); }
  #dirPop[hidden], #plusPop[hidden] { display: none; }
  #dirPop button, #plusPop button { font: inherit; color: inherit; background: none; border: 0; border-radius: 8px; padding: 7px 10px; text-align: left; cursor: pointer; }
  #dirPop button:hover, #dirPop button:focus-visible, #plusPop button:hover, #plusPop button:focus-visible { background: var(--over); color: var(--over-ink); outline: none; }
  #dirPop button[aria-checked="true"] { font-weight: 700; }
  /* the search: a square button by the folder's name that widens into the field the typed letters show in */
  #find { width: 35px; height: 35px; padding: 0; display: flex; align-items: center; overflow: hidden; transition: width .22s ease; }
  #find.on { width: min(200px, 46vw); }
  @media (max-width: 480px) { #find.on { width: min(200px, 38vw); } }
  #find:not(.on):hover { filter: brightness(1.08); }
  #find:focus-within { outline: 2px solid var(--line); outline-offset: 2px; }
  #bFind { flex: none; width: 32px; height: 32px; padding: 0; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  #bFind svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; }
  #q { flex: 1; min-width: 0; height: 100%; padding: 0 9px 0 0; border: 0; outline: none; background: none; color: var(--ink); font: italic 400 14px/1 var(--serif); }
  #find:not(.on) #q { opacity: 0; pointer-events: none; }

  #stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--stage);
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }   /* a long press picks a card up, not text or a menu */
  /* the mist: the far end of the tube and the rims, tinted a quarter of the way to the Retroma purple #7575b8 */
  /* a mist over the far end of the tube, so nothing past the great-great-grand wheel reads as anything but distance */
  #mist { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(to left, transparent 68%, var(--mist) 100%); }
  #stage.flipped #mist { background: linear-gradient(to right, transparent 68%, var(--mist) 100%); }
  /* soft blur at the edges of the view, over the scene and under everything you touch: a band on the side the directory
     columns run off, a light rim round the whole screen, and a stronger patch fading out of each corner. each layer covers
     only its own strip or corner. the band is a real blur over the far distance: from the parent column's near edge
     (measured each frame, placeSideBlur), clear there, over the parent, grandparent and great grandparent columns, growing
     to full at the screen's edge. the rim and corners are light and small, so they cost next to nothing */
  .vwBlur, #rimBlur i { position: absolute; z-index: 2; pointer-events: none; }
  /* the band is three blurs stacked, each stronger and narrower than the one under it and each fading in toward the edge
     under its own mask, so the blur grows smoothly from none at the band's inner end to full (about 11 px) at the edge.
     each blurs what the ones under it already blurred. the band itself has no mask or filter, so all three see the scene */
  #sideBlur { top: 0; bottom: 0; left: 0; width: 0; }
  #sideBlur i { position: absolute; top: 0; bottom: 0; left: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, var(--m)); mask-image: linear-gradient(to right, var(--m)); }
  #stage.flipped #sideBlur { left: auto; right: 0; }
  #stage.flipped #sideBlur i { left: auto; right: 0; -webkit-mask-image: linear-gradient(to left, var(--m)); mask-image: linear-gradient(to left, var(--m)); }
  #sideBlur .s1 { width: 100%; --m: #000 45%, transparent 100%; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #sideBlur .s2 { width: 45%; --m: #000 40%, transparent 100%; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #sideBlur .s3 { width: 18%; --m: #000 35%, transparent 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #sideBlur[hidden], #stage.centre #sideBlur { display: none; }
  /* the rim: a light blur along all four edges, and a stronger one in each corner over it (round, so it fades evenly) */
  #rimBlur { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  #rimBlur i { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #rimBlur .t { top: 0; left: 0; right: 0; height: 30px; -webkit-mask-image: linear-gradient(to bottom, #000, transparent); mask-image: linear-gradient(to bottom, #000, transparent); }
  #rimBlur .b { bottom: 0; left: 0; right: 0; height: 30px; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); }
  #rimBlur .l { top: 0; bottom: 0; left: 0; width: 30px; -webkit-mask-image: linear-gradient(to right, #000, transparent); mask-image: linear-gradient(to right, #000, transparent); }
  #rimBlur .r { top: 0; bottom: 0; right: 0; width: 30px; -webkit-mask-image: linear-gradient(to left, #000, transparent); mask-image: linear-gradient(to left, #000, transparent); }
  #rimBlur .c { width: 130px; height: 130px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    -webkit-mask-image: radial-gradient(circle at var(--at), #000, rgba(0,0,0,.45) 35%, transparent 70%); mask-image: radial-gradient(circle at var(--at), #000, rgba(0,0,0,.45) 35%, transparent 70%); }
  #rimBlur .c1 { top: 0; left: 0; --at: 0 0; }
  #rimBlur .c2 { top: 0; right: 0; --at: 100% 0; }
  #rimBlur .c3 { bottom: 0; right: 0; --at: 100% 100%; }
  #rimBlur .c4 { bottom: 0; left: 0; --at: 0 100%; }
  /* a narrow stage (a phone, or a thin pane on a desktop, so this goes by the stage's width, fitToStage): the same blur
     in px is a lot more of the picture, the parent column sits inside the band and the cards reach the edges */
  #stage.slim #sideBlur .s1 { backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(1px); }
  #stage.slim #sideBlur .s2 { width: 36%; backdrop-filter: blur(2.5px); -webkit-backdrop-filter: blur(2.5px); }
  #stage.slim #sideBlur .s3 { width: 14%; backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  #stage.slim #rimBlur .t, #stage.slim #rimBlur .b { height: 14px; }
  #stage.slim #rimBlur .l, #stage.slim #rimBlur .r { width: 14px; }
  #stage.slim #rimBlur .c { width: 84px; height: 84px; }
  #stage.dragging { cursor: grabbing; }
  #stage.hovering { cursor: pointer; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: italic 400 16px var(--serif); color: var(--ink); }
  /* empty folders get a crying gif on the tube: 60% opacity, edges feathered into the tube on every side */
  #cry { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .3s ease;
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.6) 60%, transparent 100%); mask-image: radial-gradient(closest-side, #000 30%, rgba(0,0,0,.6) 60%, transparent 100%); }
  #cry.on { opacity: .6; }
  #emptyNote { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; white-space: nowrap; font-style: italic; color: var(--ink); opacity: .7; }
  __PLAYGROUND_CSS__

  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 300px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--tip); color: var(--ink); box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo); font: 400 12px/1.45 var(--serif); }
  #tip b { display: block; font-weight: 700; overflow-wrap: anywhere; margin-bottom: 2px; }
  #tip i { font-style: italic; opacity: .75; margin-right: 6px; }
  /* the volume slider that pops up over an audio or video card */
  #volPop { position: fixed; z-index: 26; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
    box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo); }
  #volPop[hidden] { display: none; }
  #volPop input { width: 160px; accent-color: var(--acc); }
  /* a right click on a card: its details, then a row of small icon buttons, just above the pointer */
  #cardMenu { position: fixed; z-index: 28; width: max-content; min-width: 180px; max-width: calc(100vw - 16px); padding: 9px 10px 9px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 400 12px/1.45 var(--serif); display: flex; flex-direction: column; gap: 7px;
    box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo), 0 10px 26px rgba(0,0,0,.3); }
  #cardMenu[hidden] { display: none; }
  #cardMenu .name { font-weight: 700; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  #cardMenu .info i { font-style: italic; opacity: .75; margin-right: 6px; }
  #cardMenu .acts { display: flex; gap: 5px; border-top: 1px solid var(--line); padding-top: 8px; }
  #cardMenu .acts .pill { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  #cardMenu .acts .pill[hidden] { display: none; }
  #cardMenu .acts .pill[disabled] { opacity: .4; cursor: default; filter: grayscale(.6); }
  #cardMenu .acts svg { width: 15px; height: 15px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  /* on a touch screen or a phone's width the menus' buttons are big enough for a finger */
  @media (any-pointer: coarse), (max-width: 480px) {
    #dirPop button, #plusPop button { min-height: 44px; font-size: 15px; }
    #cardMenu .acts { flex-wrap: wrap; }
    #cardMenu .acts .pill { width: 44px; height: 44px; }
    #cardMenu .acts svg { width: 21px; height: 21px; }
  }
  /* a rename typed right over the card's name, the caret blinking where the name was */
  #cardRen { position: fixed; left: 0; top: 0; z-index: 26; margin: 0; padding: 0; border: 0; border-radius: 3px; background: var(--card); color: var(--ink);
    font-family: var(--serif); font-weight: 400; outline: none; box-shadow: 0 0 0 2px var(--acc); transform-origin: 0 0; }
  #cardRen[hidden] { display: none; }
  /* on the site new folders and files are Obsidian's: the button stays in place, greyed, and says so */
  #bPlus[disabled] { opacity: .45; cursor: default; filter: grayscale(.6); }
  #toast .pill { margin-left: 8px; }
  /* what is on the clipboard, at the bottom until it is pasted or cancelled: only its own box takes clicks */
  #clipBar { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 7; box-sizing: border-box;
    width: max-content; max-width: min(460px, calc(100% - 16px)); display: flex; align-items: center; gap: 9px; padding: 5px 7px 5px 10px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 400 13px/1.25 var(--serif);
    box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo), 0 6px 18px rgba(0,0,0,.25); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #clipBar[hidden] { display: none; }
  #clipBar canvas { flex: none; width: 24px; height: 24px; }
  #clipBar .what { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #clipBar .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clipBar .verb { font-size: 11px; font-style: italic; opacity: .75; }
  #clipBar .pill { flex: none; height: 32px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
  #clipBar .pill[disabled] { opacity: .45; cursor: default; }
  /* a toast waits above it */
  #toast.overClip { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  @media (any-pointer: coarse), (max-width: 480px) {
    #clipBar .pill { height: 44px; min-width: 44px; padding: 0 12px; font-size: 14px; }
    #toast.overClip { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }
  /* text only a screen reader hears: what is in the focus, said a moment after it settles */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #toast { position: fixed; z-index: 30; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 92vw; padding: 9px 16px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--tip); color: var(--ink); box-shadow: inset 1.5px 1.5px 0 var(--hi), inset -1.5px -1.5px 0 var(--lo); font: 400 13px/1.35 var(--serif); text-align: center; }
</style>

<div id="app">
  <div id="stage">
    <canvas id="gl" aria-hidden="true"></canvas>
    <img id="cry" alt="">
    <div id="emptyNote" hidden>This folder is empty</div>
    <div id="mist"></div>
    <div id="sideBlur" class="vwBlur" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
    <div id="rimBlur" aria-hidden="true"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i></div>
    <div id="msg"></div>
  </div>
  <div id="bar">
    <div id="path"></div>
    <div class="pill" id="find"><button id="bFind" type="button" title="Find in this folder (or just type)" aria-label="Find in this folder"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button><input id="q" type="text" aria-label="Find in this folder" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" tabindex="-1"></div>
    <span class="grow"></span>
    <div id="plusWrap">
      <button class="pill sq" id="bPlus" type="button" title="New folder or file here" aria-label="New folder or file here" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <div id="plusPop" hidden role="menu" aria-label="New here"><button type="button" role="menuitem" data-new="folder" title="ctrl + shift + N">New folder</button><button type="button" role="menuitem" data-new="file">New file</button></div>
    </div>
    <button class="pill sq" id="bMore" type="button" title="The menu of the card in focus" aria-label="The menu of the card in focus" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
    <div id="dirWrap">
      <button class="pill sq" id="bDir" type="button" title="Sort this folder" aria-label="Sort this folder" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9h13L12 16.5z"/></svg></button>
      <div id="dirPop" hidden role="menu" aria-label="Sort this folder"></div>
    </div>
    <button class="pill sq" id="bBoards" type="button" title="Saved playground boards" aria-label="Saved playground boards">&#128190;</button>
    <button class="pill round" id="bTheme" type="button" aria-label="Switch light or dark">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.5 7 7 0 0 1-5-15.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    </button>
  </div>
  <div id="clipBar" hidden>

  focusLead: () => { const c = child(); return c ? { s: +c.s.toFixed(3), ds: +c.ds.toFixed(4), fi: focusIndex(c) } : null; },
  mem: () => [...posMem].map(([d, s]) => d.name + ':' + s),
  switchTo: name => { const p = wheelAt(1); const it = p && p.items.find(x => x.name === name && x.isDir); if (it) switchSibling(it.ref); },
  dirs: () => { const c = child(); return c ? screenDirs(c, null) : null; },
  stackX: () => stack ? +stack.group.position.x.toFixed(4) : null,
  stackScreen: () => { if (!stack) return null; const v = new THREE.Vector3(); stack.top.card.getWorldPosition(v); v.project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height, flying: !!stack.fly }; },
  rows: () => wheels.filter(w => !w.dying).map(w => ({ dir: w.dir.name, level: w.level, s: w.s, target: w.target })),
  shape: level => { const w = wheelAt(level || 0); return w ? Object.assign({ stops: w.stops ? w.stops.length : null, n: w.items.length }, w.shape) : null; },
  places: () => { const c = child(); return c ? c.items.map((it, i) => Object.assign({ name: it.name, kind: it.isDir ? 'dir' : it.media || it.kind }, c.place[i])) : []; },
  cardSize: name => { const c = child(); for (const [, e] of c.entries) if (e.it.name === name) return { w: e.w, h: e.h, ox: e.ox, iw: e.it.w, ih: e.it.h, tile: e.tile }; return null; },
  push: () => +pushNow.toFixed(4), room: () => Object.assign({}, view),
  health: () => ({ frames: frameNo, failed: framesFailed, errors: [...frameErrs], shown: child() ? anyCardShown(child()) : false, real: stageReal }),
  // what keeps the scene from resting, apart from recent input (an empty list once everything has settled)
  busy: () => { const r = []; if (drag) r.push('drag'); if (flip.hold) r.push('hold'); if (flip.t !== flip.target) r.push('flip ' + flip.t + ' ' + flip.target); if (stack && stack.fly) r.push('fly'); if (drawQueue.size) r.push('draws ' + drawQueue.size);
    for (const w of wheels) { if (w.target !== null) r.push(w.level + ' target ' + w.target + ' s ' + w.s); if (w.coast) r.push(w.level + ' coast'); if (w.alpha < 1) r.push(w.level + ' alpha'); if (w.dying) r.push(w.level + ' dying'); if (Math.abs(w.x - w.xTarget) > 1e-3) r.push(w.level + ' x ' + w.x + ' ' + w.xTarget); }
    return r; },
  faces: level => { const w = wheelAt(level || 0); return w ? [...w.entries.values()].map(e => ({ name: e.it.name, px: e.thumbPx || 0, tile: e.tile })) : []; },
  vaultChange: m => { vaultChange(m); },
  nameStart: () => { const r = T.R + T.LIFT + T.POP_OUT, v = new THREE.Vector3(-T.CARD_W / 2 + 0.04, Math.sin(FOCUS_ANGLE) * r, Math.cos(FOCUS_ANGLE) * r).project(camera); return (v.x + 1) / 2; },
  dirSettings: () => { const d = contentDir(); return d ? dirSettings(d) : null; }, setScale,
  T, setTheme: t => { theme = t; applyTheme(); },
  // the tube's moving picture and palette, for the tests (which do not draw the scene, so they start it themselves)
  startSky: () => startSky(true), sky: () => skyState && skyState(), pal: t => { const P = PAL[t || theme]; return { sky: P.sky, a: new THREE.Color(P.a).getHexString(), b: new THREE.Color(P.b).getHexString(), base: new THREE.Color(P.base || P.a).getHexString(), uBase: cylUniforms.uBase.value.getHexString(), uA: cylUniforms.uA.value.getHexString(), uB: cylUniforms.uB.value.getHexString() }; }
};
// the card menu, cut / copy / paste and the rename on the card, for the tests
const rectOf = el => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };
Object.assign(window.VW, {

  cardOp: (level, name) => { const w = wheelAt(level); if (w) for (const [, e] of w.entries) if (e.it.name === name) return +e.op.toFixed(3); return null; },
  cardMenu: () => ({ open: !cardMenu.hidden, name: cardMenuName.textContent, info: cardMenuInfo.textContent, rect: rectOf(cardMenu),
    buttons: [...cardMenu.querySelectorAll('.acts button')].map(b => ({ m: b.dataset.m, hidden: b.hidden, disabled: b.disabled, title: b.title, label: b.getAttribute('aria-label'), text: b.textContent.trim() })) }),
  renaming: () => ren && { name: ren.ref.name, draft: !!ren.ref.draft, liveKind: ren.ref.liveKind, value: renEl.value, focused: document.activeElement === renEl, sel: [renEl.selectionStart, renEl.selectionEnd], rect: rectOf(renEl), font: parseFloat(renEl.style.fontSize) },
  // every file of the folder you are in asked for, and how many links out of storage are held (thumbtest)
  prefetchAll: () => prov.prefetch(child().items.map(x => x.ref)), keptLinks: () => keptLinks.size,
  // a place on the name of the card being renamed, on screen, as fractions of the name's box
  renamePoint: (fx, fy) => { if (!ren) return null; const b = renBox(ren.e); return faceToScreen(ren.e, b[0] + b[2] * fx, b[1] + b[3] * fy); }
});
start();
